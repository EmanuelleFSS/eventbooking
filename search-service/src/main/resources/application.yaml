spring:
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:searchservice}
    username: ${MONGO_USERNAME:}
    password: ${MONGO_PASSWORD:}
    authentication-database: ${MONGO_AUTH_DB:admin}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.eventbooking.searchservice.messaging"
        spring.json.type.mapping: >
          catalogEvent:com.eventbooking.searchservice.messaging.CatalogEvent,
          bookingEvent:com.eventbooking.searchservice.messaging.BookingEvent