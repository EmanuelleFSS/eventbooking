spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/${BOOKING_DB_NAME}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

event-service:
  base-url: ${EVENT_SERVICE_URL:http://localhost:8080}
