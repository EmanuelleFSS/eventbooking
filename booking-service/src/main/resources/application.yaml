spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/${BOOKING_DB_NAME}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

event-service:
  base-url: ${EVENT_SERVICE_URL:http://localhost:8080}
